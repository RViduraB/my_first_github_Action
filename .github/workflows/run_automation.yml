name: Run Python Script and Update Log Report

# Trigger
on:
  push:
    branches:
      - main       # main branch 
      - master     # master branch 
  workflow_dispatch:  
  schedule:
    - cron: '0 0 * * *' # උදෑසන 12:00 ට (Daily automatic run වීමට)

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python Environment Set up
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. main.py Script
      - name: Run Main Python Script
        run: python main.py

      # 4. 
      - name: Commit and Push Updated Log File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add log_report.txt
          git commit -m "Auto-update log_report.txt via GitHub Action" || exit 0
          git push
